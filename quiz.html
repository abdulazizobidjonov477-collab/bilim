<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Bilim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-quiz">

  <div class="page-topbar">
    <a href="index.html" class="logo">
      <span class="logo-mark">B</span>
      <span class="logo-text">Bilim</span>
    </a>

    <div class="lang-switcher" id="langSwitcher">
      <button class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
        <svg class="globe-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>
          <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        <span id="langCurrent">EN</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <ul class="lang-menu" id="langMenu" role="listbox">
        <li role="option" data-lang="en">English</li>
        <li role="option" data-lang="uz">O'zbekcha</li>
      </ul>
    </div>
  </div>

  <div class="quiz-wrap">
    <p class="quiz-topic-title" id="quizTopicTitle"></p>
    <div id="quizRoot" class="quiz-card">
      <!-- quiz.js fills this in -->
    </div>
  </div>

<script src="quiz.js"></script>
</body>
</html>
